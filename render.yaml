services:
  - type: web
    name: ops-cases-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start -w @ops-cases/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
